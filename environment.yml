# Version constraints here are deliberately sparse: most of the stack is left to
# the solver so it can pick a working BLAS/CUDA combination per host. The floors
# that ARE stated below each name the API in this repo that requires them.
#
# Because the solve is not reproducible from this file alone, every run records
# the versions it actually resolved into the `software_versions` block of
# run_manifest.json / manifest.json (workflow/modular/software_provenance.py).
# Read that block, not this file, when reproducing a specific run.
name: sc10x
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - scikit-image
  - h5py
  - pytables
  - scanpy=1.11.5
  - anndata
  - umap-learn
  # Floors required by `sc.tl.leiden(flavor="igraph", ...)` — clustering.py:625,
  # 698, 913, 921 and batch_correction.py:303. Conda installs these as plain
  # dependencies, so scanpy's own `leiden` extra is never enforced; the floors
  # are copied from that extra (scanpy 1.11.5 pyproject.toml:137,
  # `leiden = [ "igraph>=0.10.8", "leidenalg>=0.9.0" ]`).
  - python-igraph>=0.10.8
  - leidenalg>=0.9.0
  - numba
  - scvelo=0.3.*
  - loompy=3.0.*
  - requests
  - bbknn
  - pip:
      - scrublet
      - cellrank>=2.0
      - gseapy
      - decoupler>=1.4.0
      - liana>=0.1.7
      - infercnvpy
      - harmonypy
      - scanorama
      - pre-commit
      - pytest
      - pytest-cov
      - ruff
      - black
