name: sc_gpu
channels:
  - rapidsai
  - nvidia
  - conda-forge
dependencies:
  - python=3.13
  - pip
  # RAPIDS GPU stack
  - cuml=26.02
  - cuvs=26.02
  - cupy
  # Core scientific
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - scikit-image
  - h5py
  - numba
  # scRNA-seq core
  - scanpy
  - anndata
  - umap-learn
  - python-igraph
  - leidenalg
  - scvelo
  - loompy
  - requests
  # Testing
  - pytest
  - pytest-cov
  - pip:
      # rapids-singlecell is pip-only (thin layer on conda RAPIDS)
      - rapids-singlecell==0.14.1
      - docrep
      - scikit-misc
      # Pipeline optional backends
      - scrublet
      - cellrank>=2.0
      - gseapy
      - decoupler>=1.4.0
      - liana>=0.1.7
      - infercnvpy
      - harmonypy
      - scanorama
      - pybiomart
      - bbknn
