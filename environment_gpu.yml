# Version constraints here are deliberately sparse: the RAPIDS/CUDA solve must
# stay free to track the driver on each host. The floors that ARE stated below
# each name the API in this repo that requires them.
#
# Because the solve is not reproducible from this file alone, every run records
# the versions it actually resolved into the `software_versions` block of
# run_manifest.json / manifest.json (workflow/modular/software_provenance.py).
# Read that block, not this file, when reproducing a specific run.
name: sc_gpu
channels:
  - rapidsai
  - nvidia
  - conda-forge
dependencies:
  - python=3.13
  - pip
  # RAPIDS GPU stack
  - cuml=26.02
  - cuvs=26.02
  - cupy
  # Core scientific
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - scikit-image
  - h5py
  - numba
  # scRNA-seq core
  # scanpy>=1.10: `sc.pp.pca(mask_var="highly_variable")` (clustering.py:507,
  # 599, 672, 728) and `sc.tl.leiden(flavor="igraph")` (clustering.py:625, 698,
  # 913, 921) are both hard requirements of the production clustering lane, and
  # neither parameter exists before 1.10.0. Measured against upstream sources:
  # `mask_var` appears 0x in scanpy 1.9.8 preprocessing/_pca.py and 20x in
  # 1.10.0; `flavor` appears 0x in 1.9.8 tools/_leiden.py and 7x in 1.10.0.
  # No upper bound: 1.11/1.12 are both exercised by this factory.
  - scanpy>=1.10
  - anndata
  - umap-learn
  # Floors required by `sc.tl.leiden(flavor="igraph", ...)`. Conda installs these
  # as plain dependencies, so scanpy's own `leiden` extra is never enforced; the
  # floors are copied from that extra (scanpy 1.11.5 pyproject.toml:137,
  # `leiden = [ "igraph>=0.10.8", "leidenalg>=0.9.0" ]`).
  - python-igraph>=0.10.8
  - leidenalg>=0.9.0
  - scvelo
  - loompy
  - requests
  # Testing
  - pytest
  - pytest-cov
  - pip:
      # rapids-singlecell is pip-only (thin layer on conda RAPIDS)
      - rapids-singlecell==0.14.1
      - docrep
      - scikit-misc
      # Pipeline optional backends
      - scrublet
      # pydeseq2 is CLAIM-CRITICAL: it is the only backend for which
      # pseudobulk_de.py sets inference_status="supported_confirmatory" and
      # claimable=True. Without it, mode=confirmatory degrades to
      # "exploratory_nonclaimable_backend_fallback" -- loudly, which is the right
      # behaviour, but it means a rebuilt env silently loses the ability to make a
      # confirmatory DE claim at all. It was installed in sc_gpu and declared in NO
      # committed spec. Declared 2026-08-02; enforced by the claim-integrity gate.
      - pydeseq2==0.5.4
      - cellrank>=2.0
      - gseapy
      - decoupler>=1.4.0
      - liana>=0.1.7
      - infercnvpy
      - harmonypy
      - scanorama
      - pybiomart
      - bbknn
