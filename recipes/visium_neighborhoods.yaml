name: visium_neighborhoods
description: "Visium spatial transcriptomics: ingest + neighborhood analytics + spatial bundle"
modality_hint: spatial
optional_modules:
  - clustering
  - differential_expression
  - annotation
  - spatial_ingest
  - spatial_neighborhoods
# Wave-2: scfactory fails preflight if these packages cannot be imported
# (do not start a long run that will only discover the gap mid-module).
required_python_packages:
  - squidpy
scale_preset: standard
bundle:
  enabled: true
  include_protein: false
  include_spatial: true
  include_multimodal_obsm: false
  schema_version: v2.1
notes: |
  Visium / generic spatial workflow. spatial_ingest attaches (x,y) coords +
  library metadata; spatial_neighborhoods computes Moran's I, neighborhood
  enrichment, and co-occurrence.
  Requires squidpy in the active environment (enforced at scfactory preflight
  and surfaced in `scfactory doctor` readiness.spatial_analytics). Without
  squidpy the recipe exits non-zero before the modular pipeline starts.
  The v2.1 bundle's spatial extension is enabled.
