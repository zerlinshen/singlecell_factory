# Validated core GPU lane for RTX 5090 / Blackwell on NVIDIA driver 595.84.
# This environment intentionally covers clustering, marker DE, Scrublet,
# scVI, and CellRank.  LIANA remains outside this environment because LIANA
# 1.9 requires pandas<3 while RAPIDS 26.08 requires pandas>=3.
name: sc_gpu_rapids2608
channels:
  - rapidsai
  - conda-forge
  - nvidia
dependencies:
  - python=3.13
  - cuda-version=13.2
  - cuda-nvcc=13.2
  - cudf=26.08
  - cuml=26.08
  - cugraph=26.08
  - rmm=26.08
  - cuvs=26.08
  - cupy=14.2
  - pytorch=2.13
  - scanpy=1.12
  - anndata=0.13
  - pandas=3.0.3
  - scipy=1.16.3
  - scikit-image
  - scikit-misc
  - python-igraph
  - leidenalg
  - cellrank=2.3.2
  - pygpcca=1.0.4
  - scvi-tools=1.5
  - pytest
  - pytest-cov
  - jsonschema
  - pip
  - pip:
      # PyPI currently ships 0.16.1 as source. cuda-nvcc above and an active
      # environment PATH are required while its abi3 CUDA extension builds.
      - rapids-singlecell==0.16.1
      - scrublet==0.2.3
      - annoy==1.17.3
      - harmonypy==0.0.10
