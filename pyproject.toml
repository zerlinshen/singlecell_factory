[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=workflow --cov-report=term-missing --cov-report=xml -m 'not perf and not r_contract'"
markers = [
    "perf: performance regression gate (run explicitly via `pytest -m perf`)",
    "r_contract: Python <-> R bundle round-trip tests (require Rscript env; run explicitly via `pytest -m r_contract`)",
]

[tool.coverage.run]
source = ["workflow"]
branch = true

[tool.coverage.report]
fail_under = 20
show_missing = true
omit = ["workflow/modular/*", "workflow/query_cbioportal.py"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
