repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: contracts-cross-repo-parity
        name: contracts cross-repo parity
        entry: tools/check_contracts_cross_repo.sh
        language: system
        pass_filenames: false
        files: ^(contracts/bundle_schema\.yaml|contracts/\.expected_sha256)$
