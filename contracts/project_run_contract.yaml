# Remote factory/project governance contract.
# Control-plane contract only; not a scientific output.
# Version: 1.1 (C2 reproduction fields added 2026-05-18)
schema_version: project-run-governance/v1

principles:
  - factories_are_tools_projects_are_data
  - project_roots_own_scientific_artifacts
  - factory_reports_are_control_plane_not_scientific_outputs
  - validation_is_non_destructive_by_default

project_root:
  path_pattern: "/home/zerlinshen/projects/<project-id>"
  required_entries:
    - project.yaml
    - inputs/
    - runs/
    - configs/
    - notebooks/

run_root:
  path_pattern: "/home/zerlinshen/projects/<project-id>/runs/<run-id>"
  required_entries_for_new_governance_runs:
    - manifest.json
    - python/
    - r/
    - logs/
  root_manifest_semantics: cross_factory_run_envelope

human_facing_deliverables:
  description: Stable surfaces for human review and wet-lab/manuscript decisions.
  preferred_entries:
    - reports/
    - figures/
    - conclusions.md
    - human_summary.md
  naming_preference: concise_biological_question_first
  required_quality:
    - visual_artifacts_are_discoverable
    - conclusions_link_back_to_run_evidence
    - no_raw_executor_logs_as_primary_entrypoint

agent_facing_provenance:
  description: Detailed surfaces for executors, validators, and reproducibility.
  preferred_entries:
    - manifest.json
    - python/run_manifest.json
    - python/module_status.csv
    - r/**/*manifest*.json
    - logs/
    - .checkpoints/
  naming_preference: explicit_timestamp_commit_module_status
  required_quality:
    - machine_parseable_when_possible
    - dirty_tree_provenance_recorded
    - enough_detail_to_resume_or_audit

producer_native_provenance:
  python:
    examples:
      - python/run_manifest.json
      - python/**/run_manifest.json
      - python/**/module_status.csv
  r:
    examples:
      - r/**/manifest*.json
      - r/**/provenance*.json
  bundle:
    examples:
      - python/bundle/provenance.json
      - python/**/bundle/provenance.json

purpose_driven_module_selection:
  description: Choose modules from the biological/reproduction question and available modalities; do not run every optional module by default.
  required_decision_fields:
    - scientific_question
    - modalities_present
    - expected_human_deliverables
    - required_upstream_artifacts
    - candidate_modules
    - safe_skip_conditions
    - wet_lab_or_manuscript_decision
  example_lanes:
    baseline_qc:
      intent: confirm data quality and clustering baseline
      modules: [cellranger, qc, doublet_detection, clustering, annotation]
    developmental_trajectory:
      intent: resolve lineage/fate timing and maturation gradients
      modules: [trajectory, pseudo_velocity, rna_velocity, cell_fate, gene_signature_scoring]
    regulatory_multiomics:
      intent: connect chromatin/accessibility/regulatory programs to cell states
      modules: [atac_ingest, atac_qc, atac_lsi, chromvar, peak_to_gene, multimodal_integration, tf_network]
    three_d_genome:
      intent: inspect contact-domain or 3D genome hypotheses
      modules: [hic_ingest, hic_tad, gwas_overlay]
    tumor_microenvironment:
      intent: quantify malignant, immune, and stromal programs
      modules: [cnv_inference, immune_phenotyping, tumor_microenvironment, cell_communication, composition]
    manuscript_reproduction:
      intent: reproduce selected published figures and claim-level evidence
      modules: [paper_repro, differential_expression, pathway_analysis, pseudobulk_de]

severity_model:
  error:
    description: Violation in a new-governance run or missing project root.
  warning:
    description: Legacy or partial project state, including missing manifests or dirs when substitute provenance exists.
  info:
    description: Optional improvement, future project pointer, or local sync recommendation.


project_retention_and_backup_policy:
  default_rule: keep_latest_validated_run_result
  override_location_options:
    - project.yaml
    - ops/governance_records/<project-policy-round>/POLICY.md
    - project_root/ledger/<project-policy>.yaml
  required_project_fields:
    - project_purpose
    - analysis_type
    - method_family
    - selected_best_parameters
    - module_list
    - filtering_thresholds
    - batch_or_integration_keys
    - sketch_or_metacell_settings
    - random_seed
    - latest_source_of_truth_run_id
    - latest_source_of_truth_run_path
    - superseded_run_ids
    - upstream_repository
    - raw_data_reproduction
    - data_object_reproduction
    - figure_reproduction
    - module_gap_decisions
    - context_optimization_decisions
    - final_backup_contents
    - never_delete_assets
  final_backup_contents:
    - manifest.json
    - producer_native_manifests
    - module_status.csv
    - launch_command_or_wrapper
    - launch_log
    - parameter_file
    - environment_pins
    - final_labeled_object_or_compact_atlas
    - human_facing_figures_reports
    - conclusions_summary
  never_delete_assets:
    - raw_data
    - prepared_canonical_inputs
    - source_code
    - environment_definitions
    - launch_scripts
    - governance_records
    - currently_cited_report_assets

phase_1_prohibitions:
  - do_not_move_or_delete_project_run_artifacts
  - do_not_rewrite_legacy_manifests
  - do_not_consolidate_repositories
  - do_not_treat_local_reproduction_trail_as_target

# ---------------------------------------------------------------------------
# C2 Reproduction Methodology Fields (all optional — existing projects do not
# need to populate these; new reproduction projects should populate all six)
# Added: 2026-05-18 (C2.3)
# See: docs/PAPER_REPRODUCTION_SOP.md for field semantics and parity taxonomy
# ---------------------------------------------------------------------------

upstream_repository:
  optional: true
  description: >-
    Provenance of the upstream paper repository that this project reproduces.
    All sub-fields are optional but should be populated before the first
    reproduction run is launched.
  fields:
    url:
      type: string
      optional: true
      description: Git URL of the upstream paper repository or Zenodo deposit URL.
    commit_or_tag:
      type: string
      optional: true
      description: Pinned git commit SHA or release tag used for reproduction.
    doi:
      type: string
      optional: true
      description: DOI of the paper or code deposit (e.g., 10.1016/j.cell.2021.07.023).
    license:
      type: string
      optional: true
      description: SPDX license identifier of the upstream repository (e.g., MIT, CC-BY-4.0).
    forked_at:
      type: string
      optional: true
      description: ISO-8601 date when the upstream repo was forked/cloned (e.g., 2026-05-18).
    fork_path:
      type: string
      optional: true
      description: >-
        Local absolute path of the upstream clone, e.g.
        projects/<project-id>/upstream/<repo-name>/

raw_data_reproduction:
  optional: true
  description: >-
    Records whether raw-data reproduction was attempted and what the outcome
    or blocking boundary was.
  fields:
    attempted:
      type: boolean
      description: true if any pipeline run was launched from raw data (FASTQ/fragments).
    success:
      type: boolean
      description: true if the raw-data run produced outputs matching the paper's reported metrics.
    boundary:
      type: string
      optional: true
      description: >-
        Free-text description of what stopped reproduction when success is false,
        e.g. "GPU OOM at module 7", "missing reference genome hg38",
        "FASTQ not publicly available".

data_object_reproduction:
  optional: true
  description: >-
    Parity evaluation keyed by data object class name (e.g. obs, obsm, markers).
    Each value must be one of the five parity taxonomy classes:
    exact | approximate | proxy | unsupported | resource_gap
    See docs/PAPER_REPRODUCTION_SOP.md §6 for class definitions.
  value_type: parity_taxonomy_class
  allowed_values:
    - exact
    - approximate
    - proxy
    - unsupported
    - resource_gap
  example:
    obs: exact
    obsm: approximate
    markers: proxy

figure_reproduction:
  optional: true
  description: >-
    Parity evaluation keyed by figure panel ID (e.g. figure1a, figure3b).
    Each value must be one of the five parity taxonomy classes.
    See docs/PAPER_REPRODUCTION_SOP.md §6 for class definitions.
  value_type: parity_taxonomy_class
  allowed_values:
    - exact
    - approximate
    - proxy
    - unsupported
    - resource_gap
  example:
    figure1a: approximate
    figure2b: resource_gap

module_gap_decisions:
  optional: true
  description: >-
    List of per-method gap routing decisions. Each item declares where the
    method gap is absorbed in the three-factory architecture.
    target must be one of: singlecell_factory | r_multiomics_factory |
    plotting_factory | paper_specific_script | parameter_change_only
    See docs/PAPER_REPRODUCTION_SOP.md §7 for routing rules.
  item_schema:
    module:
      type: string
      description: Method or analysis step name.
    gap_class:
      type: string
      description: Parity taxonomy class for this gap (from data_object_reproduction taxonomy).
    target:
      type: string
      description: Factory routing target for this gap.
      allowed_values:
        - singlecell_factory
        - r_multiomics_factory
        - plotting_factory
        - paper_specific_script
        - parameter_change_only
    rationale:
      type: string
      description: Free-text justification for the routing decision.
  example:
    - module: bpnet_tf_footprinting
      gap_class: resource_gap
      target: paper_specific_script
      rationale: >-
        Requires BPNet model training on 8× A100 GPUs; not feasible in current
        environment. Paper-specific script retained under projects/wave5-trevino/.

context_optimization_decisions:
  optional: true
  description: >-
    List of per-parameter tuning records where our run diverges from the
    upstream paper's stated settings. Every divergence must have an entry.
    See docs/PAPER_REPRODUCTION_SOP.md §8 for schema and rules.
  item_schema:
    parameter:
      type: string
      description: Parameter name (e.g. n_neighbors, resolution, min_cells).
    upstream_value:
      type: any
      description: Value from the paper's code or methods section.
    our_value:
      type: any
      description: Value actually used in our run.
    rationale:
      type: string
      description: >-
        Free text explaining the divergence (dataset size, resource constraint,
        library version, batch structure, etc.).
    parity_class:
      type: string
      description: Parity impact class from the taxonomy in data_object_reproduction.
      allowed_values:
        - exact
        - approximate
        - proxy
        - unsupported
        - resource_gap
  example:
    - parameter: n_neighbors
      upstream_value: 30
      our_value: 15
      rationale: Smaller dataset (42k cells vs 130k) benefits from lower k to avoid over-smoothing.
      parity_class: approximate
